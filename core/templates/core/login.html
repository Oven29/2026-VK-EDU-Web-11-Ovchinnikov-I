{% extends 'questions/base.html' %}

{% block title %}Ivan Ask: Login{% endblock %}

{% block content %}
<h2 class="mb-4">Log In</h2>

<span class="text-danger d-block mt-1 error-msg"></span>

<form action="#" class="mt-3" style="max-width: 500px;">

    <div class="row mb-3 align-items-center">
        <label class="col-sm-3 col-form-label fw-bold">Login</label>

        <div class="col-sm-9">
            <input type="text" class="form-control" placeholder="Enter your login here">
        </div>
    </div>

    <div class="row mb-3 align-items-center">
        <label class="col-sm-3 col-form-label fw-bold">Password</label>
        <div class="col-sm-9">
            <input type="password" class="form-control" placeholder="qwerty123">
        </div>
    </div>

    <div class="row">
        <div class="col-sm-9 offset-sm-3">
            <button type="submit" class="btn btn-dark px-4 mb-2">Log in!</button>
            <br>
            <a href="{% url 'signup' %}" class="small">create new account</a>
        </div>
    </div>
</form>
{% endblock %}
