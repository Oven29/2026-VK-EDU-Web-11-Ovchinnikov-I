{% extends "base.html" %}

{% block title %}Вход - Ivan Ask{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <h2 class="mb-4">Вход</h2>
        <form method="post" action="{% url 'login' %}">
            {% csrf_token %}
            <input type="hidden" name="next" value="{{ next }}">

            {% include "core/includes/form_fields.html" %}

            <button type="submit" class="btn btn-primary">Войти</button>
            <div class="mt-3">
                <p>Впервые у нас? <a href="{% url 'signup' %}">Создать аккаунт</a></p>
            </div>
        </form>
    </div>
</div>
{% endblock %}
