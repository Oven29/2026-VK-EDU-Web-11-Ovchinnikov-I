{% extends 'questions/base.html' %}

{% block title %}Profile settings{% endblock %}

{% block content %}
<h2 class="mb-4">Settings: Ivan Ovchinnikov</h2>

<span class="text-danger d-block mt-1 error-msg"></span>

<form action="#" class="mt-4">
    <div class="row mb-3 align-items-center">
        <label class="col-sm-2 col-form-label fw-bold">Login</label>
        <div class="col-sm-6">
            <input type="text" class="form-control" value="ivan123">
        </div>
    </div>

    <div class="row mb-3 align-items-center">
        <label class="col-sm-2 col-form-label fw-bold">Email</label>
        <div class="col-sm-6">
            <input type="email" class="form-control email-input" value="dr.pepper@mail.ru">
        </div>
    </div>

    <div class="row mb-3 align-items-center">
        <label class="col-sm-2 col-form-label fw-bold">NickName</label>
        <div class="col-sm-6">
            <input type="text" class="form-control" value="Dr. Pepper">
        </div>
    </div>

    <div class="row mb-3">
        <label class="col-sm-2 col-form-label fw-bold">Upload avatar</label>
        <div class="col-sm-6">
            <div class="avatar-box mb-2 d-flex align-items-center justify-content-center"><span>avatar</span></div>
            <input class="form-control" type="file">
        </div>
    </div>

    <div class="row mt-4">
        <div class="col-sm-6 offset-sm-2">
            <button type="submit" class="btn btn-dark px-4">Save</button>
        </div>
    </div>
</form>
{% endblock %}
