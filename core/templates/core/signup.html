{% extends "base.html" %}

{% block title %}Регистрация - Ivan Ask{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <h2 class="mb-4">Регистрация</h2>
        <form method="post" action="{% url 'signup' %}" enctype="multipart/form-data">
            {% csrf_token %}

            {% include "core/includes/form_fields.html" %}

            <button type="submit" class="btn btn-primary">Зарегистрироваться</button>
            <div class="mt-3">
                <p>Уже есть аккаунт? <a href="{% url 'login' %}">Войти</a></p>
            </div>
        </form>
    </div>
</div>
{% endblock %}
