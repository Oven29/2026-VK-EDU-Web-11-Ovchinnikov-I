{% extends 'questions/base.html' %}

{% block title %}Ivan Ask: Registration{% endblock %}

{% block content %}
<h2 class="mb-4">Registration</h2>

<span class="text-danger d-block mt-1 error-msg"></span>

<form action="#" class="mt-4">
    <div class="row mb-3 align-items-center">
        <label class="col-sm-3 col-form-label fw-bold">Login</label>
        <div class="col-sm-7">
            <input type="text" class="form-control" placeholder="ivan">
        </div>
    </div>

    <div class="row mb-3 align-items-center">
        <label class="col-sm-3 col-form-label fw-bold">Email</label>
        <div class="col-sm-7">
            <input type="email" class="form-control email-input" placeholder="dr.pepper@mail.ru">
        </div>
    </div>

    <div class="row mb-3 align-items-center">
        <label class="col-sm-3 col-form-label fw-bold">NickName</label>
        <div class="col-sm-7">
            <input type="text" class="form-control" placeholder="Nickname">
        </div>
    </div>

    <div class="row mb-3 align-items-center">
        <label class="col-sm-3 col-form-label fw-bold">Password</label>
        <div class="col-sm-7">
            <input type="password" class="form-control" placeholder="qwerty123">
        </div>
    </div>

    <div class="row mb-3 align-items-center">
        <label class="col-sm-3 col-form-label fw-bold">Repeat password</label>
        <div class="col-sm-7">
            <input type="password" class="form-control" placeholder="qwerty123">
        </div>
    </div>

    <div class="row mb-3">
        <label class="col-sm-3 col-form-label fw-bold">Upload avatar</label>
        <div class="col-sm-7">
            <input class="form-control" type="file">
        </div>
    </div>

    <div class="row mt-4">
        <div class="col-sm-7 offset-sm-3">
            <button type="submit" class="btn btn-dark px-4">Register!</button>
        </div>
    </div>
</form>
{% endblock %}
