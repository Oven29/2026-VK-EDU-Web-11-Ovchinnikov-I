{% extends 'base.html' %}

{% block title %}Error! 🫨{% endblock %}

{% block content %}
<div class="container text-center vh-100 d-flex flex-column justify-content-center">
    <div class="error-wrapper">
        <h1 class="display-1 fw-bold text-danger">{% block error_code %}{% endblock %}</h1>
        <h2 class="mb-4">{% block error_title %}{% endblock %}</h2>
        <p class="lead text-muted">{% block error_message %}{% endblock %}</p>
        <div class="mt-4">
            <a href="{% url 'index' %}" class="btn btn-primary rounded-pill px-4">На главную</a>
            <button onclick="history.back()" class="btn btn-outline-secondary rounded-pill px-4 ms-2">Назад</button>
        </div>
    </div>
</div>
{% endblock %}
